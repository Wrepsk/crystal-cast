name: Release

on:
  push:
    # 0.9.3 is a release for everyone; testing-0.9.3.1 is a testing build that only players who turned on
    # testing builds for CrystalCast in Dalamud get. Standalone benchmark prereleases have their own
    # workflow and tag prefix.
    tags: ['[0-9]*', 'testing-[0-9]*']

permissions:
  contents: write

jobs:
  webkitgtk-host:
    # Native Linux WebKitGTK helper for the Wine browser backend. Built on Ubuntu 24.04
    # (glibc 2.39+) and packaged into the plugin by the Windows job.
    name: Native WebKitGTK helper (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Restore helper built by CI
        # CI on master saves the helper under a key made from its source files (see ci.yml; keep the keys
        # in sync). On a match, this release skips installing packages and building, so an Ubuntu mirror
        # outage cannot block it.
        id: helper-cache
        uses: actions/cache/restore@v4
        with:
          path: native/webkitgtk-host/build/crystalcast-webkit-host
          key: webkitgtk-host-ubuntu-24.04-v1-${{ hashFiles('native/webkitgtk-host/Makefile', 'native/webkitgtk-host/*.c', 'native/webkitgtk-host/*.h') }}

      - name: Use a reachable Ubuntu package mirror
        # The runner's default Azure mirror can be unreachable; see the script for details.
        if: steps.helper-cache.outputs.cache-hit != 'true'
        run: sh scripts/use-reachable-ubuntu-mirror.sh

      - name: Install build dependencies
        if: steps.helper-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libwebkitgtk-6.0-dev libgtk-4-dev

      - name: Build helper with warnings as errors
        if: steps.helper-cache.outputs.cache-hit != 'true'
        run: make -C native/webkitgtk-host

      - name: Report helper source
        run: |
          if [ "${{ steps.helper-cache.outputs.cache-hit }}" = "true" ]; then
            echo "Using the helper CI built for these sources."
          else
            echo "No cached helper for these sources; built it here."
          fi
          file native/webkitgtk-host/build/crystalcast-webkit-host

      - name: Check launcher script syntax
        run: sh -n native/webkitgtk-host/launch.sh

      - name: Upload helper
        uses: actions/upload-artifact@v4
        with:
          name: crystalcast-webkit-host-${{ github.sha }}
          path: native/webkitgtk-host/build/crystalcast-webkit-host
          if-no-files-found: error
          retention-days: 7

  release:
    runs-on: windows-2022
    needs: webkitgtk-host
    outputs:
      version: ${{ steps.tag.outputs.version }}
      channel: ${{ steps.tag.outputs.channel }}

    steps:
      - name: Read version and channel from the tag
        id: tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -match '^testing-(\d+\.\d+\.\d+(?:\.\d+)?)$') {
            $version = $Matches[1]; $channel = 'testing'
          }
          elseif ($env:GITHUB_REF_NAME -match '^\d+\.\d+\.\d+(?:\.\d+)?$') {
            $version = $env:GITHUB_REF_NAME; $channel = 'stable'
          }
          else {
            throw "Release tags are a numeric version (0.9.3) or testing- and one (testing-0.9.3.1)."
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "channel=$channel" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CHANNEL=$channel" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Building $channel version $version."

      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Download native Linux helper
        # The plugin project packages the helper when this file exists. The Linux
        # launcher marks it executable, so the lost file mode does not matter.
        uses: actions/download-artifact@v4
        with:
          name: crystalcast-webkit-host-${{ github.sha }}
          path: native/webkitgtk-host/build

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.100
          cache: true
          cache-dependency-path: |
            CrystalCast/packages.lock.json
            CrystalCast.Tests/packages.lock.json
            CrystalRenderer/CrystalRenderer/packages.lock.json
            CrystalRenderer/CrystalRenderer.Tests/packages.lock.json

      - name: Install Dalamud development files
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile dalamud.zip
          Expand-Archive -Force dalamud.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: Restore locked dependencies
        run: dotnet restore CrystalCast.sln --locked-mode -p:Platform=x64

      - name: Build plugin, renderer, and tests with analyzers
        run: dotnet build CrystalCast.sln --configuration Release --no-restore -p:Platform=x64 -p:RunAnalyzers=true

      - name: Run tests
        run: dotnet test CrystalCast.sln --configuration Release --no-build --no-restore -p:Platform=x64

      - name: Verify package and version
        shell: pwsh
        run: ./scripts/Verify-Package.ps1 -ExpectedVersion $env:VERSION -IncludesWebKitGtkHost

      - name: Name release asset
        shell: pwsh
        run: |
          $asset = "CrystalCast-$env:VERSION.zip"
          Copy-Item -LiteralPath CrystalCast/bin/x64/Release/CrystalCast/latest.zip -Destination $asset
          "ASSET_PATH=$asset" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrystalCast-${{ github.ref_name }}
          path: ${{ env.ASSET_PATH }}
          if-no-files-found: error

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME $env:ASSET_PATH --clobber
          }
          elseif ($env:CHANNEL -eq 'testing') {
            # A pre-release: downloadable, but never shown as the latest release.
            gh release create $env:GITHUB_REF_NAME $env:ASSET_PATH --verify-tag --generate-notes --prerelease --title "CrystalCast $env:VERSION (testing)"
          }
          else {
            gh release create $env:GITHUB_REF_NAME $env:ASSET_PATH --verify-tag --generate-notes --title "CrystalCast $env:VERSION"
          }

          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release publication failed."
          }

  update-plugin-repo:
    # Points the Dalamud plugin repository (repo.json on the "repo" branch) at the release just published:
    # AssemblyVersion and the download links for a release, TestingAssemblyVersion and DownloadLinkTesting
    # for a testing build.
    name: Update repo.json
    runs-on: ubuntu-24.04
    needs: release
    concurrency:
      group: plugin-repo
      cancel-in-progress: false

    steps:
      - name: Check out repo branch
        uses: actions/checkout@v5
        with:
          ref: repo

      - name: Update version and download links
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.release.outputs.version }}
          CHANNEL: ${{ needs.release.outputs.channel }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -eu
          # Dalamud wants four parts: 0.9.0 -> 0.9.0.0.
          version="$VERSION"
          while [ "$(printf '%s' "$version" | tr -cd '.' | wc -c)" -lt 3 ]; do version="$version.0"; done

          if [ "$CHANNEL" = "testing" ]; then
            field=TestingAssemblyVersion
            filter='.TestingAssemblyVersion = $version | .DownloadLinkTesting = $link'
          else
            field=AssemblyVersion
            filter='.AssemblyVersion = $version | .DownloadLinkInstall = $link | .DownloadLinkUpdate = $link'
          fi

          # Re-running an older tag must not move the repository back to it.
          current=$(jq -r --arg field "$field" '.[0][$field] // "0.0.0.0"' repo.json)
          newest=$(printf '%s\n%s\n' "$current" "$version" | sort -V | tail -n 1)
          if [ "$newest" != "$version" ]; then
            echo "repo.json already has $field $current, newer than $version; leaving it."
            exit 0
          fi

          link="https://github.com/$REPOSITORY/releases/download/$TAG/CrystalCast-$VERSION.zip"
          jq --arg version "$version" --arg link "$link" \
            "map(if .InternalName == \"CrystalCast\" then $filter else . end)" \
            repo.json > repo.json.new
          mv repo.json.new repo.json

          if git diff --quiet; then
            echo "repo.json already points at $TAG."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Point repo.json at $TAG"
          git push origin HEAD:repo
