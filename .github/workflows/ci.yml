name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.configuration }} x64
    runs-on: windows-2022
    needs: webkitgtk-host
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Download native Linux helper
        # The plugin project packages the helper when this file exists. The Linux
        # launcher marks it executable, so the lost file mode does not matter.
        uses: actions/download-artifact@v4
        with:
          name: crystalcast-webkit-host-${{ github.sha }}
          path: native/webkitgtk-host/build

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.100
          cache: true
          cache-dependency-path: |
            CrystalCast/packages.lock.json
            CrystalCast.Tests/packages.lock.json
            CrystalRenderer/CrystalRenderer/packages.lock.json
            CrystalRenderer/CrystalRenderer.Tests/packages.lock.json

      - name: Install Dalamud development files
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile dalamud.zip
          Expand-Archive -Force dalamud.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: Restore locked dependencies
        run: dotnet restore CrystalCast.sln --locked-mode -p:Platform=x64

      - name: Build plugin, renderer, and tests with analyzers
        run: dotnet build CrystalCast.sln --configuration ${{ matrix.configuration }} --no-restore -p:Platform=x64 -p:RunAnalyzers=true

      - name: Run tests
        run: dotnet test CrystalCast.sln --configuration ${{ matrix.configuration }} --no-build --no-restore -p:Platform=x64

      - name: Verify release package
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: ./scripts/Verify-Package.ps1 -IncludesWebKitGtkHost

      - name: Upload release package
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: CrystalCast-${{ github.sha }}
          path: CrystalCast/bin/x64/Release/CrystalCast/latest.zip
          if-no-files-found: error
          retention-days: 7

  webkitgtk-host:
    # Native Linux WebKitGTK helper for the Wine browser backend; packaged into the plugin.
    name: Native WebKitGTK helper (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Use a reachable Ubuntu package mirror
        # The runner's default Azure mirror can be unreachable; see the script for details.
        run: sh scripts/use-reachable-ubuntu-mirror.sh

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libwebkitgtk-6.0-dev libgtk-4-dev

      - name: Build helper with warnings as errors
        run: make -C native/webkitgtk-host

      - name: Check launcher script syntax
        run: sh -n native/webkitgtk-host/launch.sh

      - name: Save helper for release builds
        # Release runs restore this instead of installing packages and building again. Tag runs can read
        # caches saved on master. The key matches the release workflow's; keep the two in sync.
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/cache/save@v4
        with:
          path: native/webkitgtk-host/build/crystalcast-webkit-host
          key: webkitgtk-host-ubuntu-24.04-v1-${{ hashFiles('native/webkitgtk-host/Makefile', 'native/webkitgtk-host/*.c', 'native/webkitgtk-host/*.h') }}

      - name: Upload helper
        uses: actions/upload-artifact@v4
        with:
          name: crystalcast-webkit-host-${{ github.sha }}
          path: native/webkitgtk-host/build/crystalcast-webkit-host
          if-no-files-found: error
          retention-days: 7
