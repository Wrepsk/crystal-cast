name: Release

on:
  push:
    tags: ['*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022

    steps:
      - name: Validate release tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^\d+\.\d+\.\d+(?:\.\d+)?$') {
            throw "Release tags must contain only a numeric version, for example 0.6.0."
          }

      - name: Check out repository and submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.100
          cache: true
          cache-dependency-path: |
            CrystalCast/packages.lock.json
            CrystalCast.Tests/packages.lock.json
            ThirdParty/ffxiv_pictomancy/Pictomancy/packages.lock.json

      - name: Install Dalamud development files
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile dalamud.zip
          Expand-Archive -Force dalamud.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: Restore locked dependencies
        run: dotnet restore CrystalCast.sln --locked-mode -p:Platform=x64

      - name: Build pinned Pictomancy source
        run: dotnet build ThirdParty/ffxiv_pictomancy/Pictomancy/Pictomancy.csproj --configuration Release --no-restore -p:Platform=x64 -p:RunAnalyzers=false

      - name: Build CrystalCast and run analyzers
        run: dotnet build CrystalCast/CrystalCast.csproj --configuration Release --no-restore --no-dependencies -p:Platform=x64 -p:RunAnalyzers=true

      - name: Build tests and run analyzers
        run: dotnet build CrystalCast.Tests/CrystalCast.Tests.csproj --configuration Release --no-restore --no-dependencies -p:Platform=x64 -p:RunAnalyzers=true

      - name: Run tests
        run: dotnet test CrystalCast.Tests/CrystalCast.Tests.csproj --configuration Release --no-build --no-restore -p:Platform=x64

      - name: Verify package and version
        shell: pwsh
        run: ./scripts/Verify-Package.ps1 -ExpectedVersion $env:GITHUB_REF_NAME

      - name: Name release asset
        shell: pwsh
        run: |
          $asset = "CrystalCast-$env:GITHUB_REF_NAME.zip"
          Copy-Item -LiteralPath CrystalCast/bin/x64/Release/CrystalCast/latest.zip -Destination $asset
          "ASSET_PATH=$asset" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrystalCast-${{ github.ref_name }}
          path: ${{ env.ASSET_PATH }}
          if-no-files-found: error

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME $env:ASSET_PATH --clobber
          }
          else {
            gh release create $env:GITHUB_REF_NAME $env:ASSET_PATH --verify-tag --generate-notes --title "CrystalCast $env:GITHUB_REF_NAME"
          }

          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release publication failed."
          }
