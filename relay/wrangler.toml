name = "crystalcast-relay"
main = "src/index.ts"
compatibility_date = "2025-09-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# SQLite-backed Durable Objects are the ones available on the Workers Free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[durable_objects.bindings]]
name = "PERSISTENT_ROOMS"
class_name = "PersistentRoom"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["PersistentRoom"]
